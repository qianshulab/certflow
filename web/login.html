<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · CertFlow</title><link rel="stylesheet" href="/login.css"><script src="/login.js" defer></script></head>
<body><main><div class="brand"><span class="mark">C</span> CertFlow</div><p class="eyebrow">YOUR CERTIFICATE WORKSPACE</p><h1>欢迎回来</h1><p class="description">登录你的证书工作台，管理签发、部署与自动续期。</p><form id="login-form"><label for="password">管理密码</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="12" maxlength="1024" autofocus><p id="login-error" role="alert"></p><button type="submit">登录工作台 <span aria-hidden="true">→</span></button></form><p class="footnote">使用部署时设置的管理密码。<br>证书和 DNS 凭据保存在运行 CertFlow 的设备上。</p></main></body></html>
