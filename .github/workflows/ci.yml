name: Verify and build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested image to GHCR (main branch only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: certflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Node tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CERTFLOW_REQUIRE_LEGO_TEST: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm run check
      - name: Install verified upstream lego for bridge integration
        run: node scripts/setup-test-lego.mjs
      - name: Run unit and real client integration tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          npm test 2>&1 | tee reports/node-tests.txt
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: node-tests-${{ matrix.os }}
          path: reports/node-tests.txt
          if-no-files-found: warn
          retention-days: 30

  image:
    name: Linux image and container smoke
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Resolve image version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag must match package.json version: v$VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build Linux amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: certflow:ci
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify isolated container and persistent data
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          node scripts/docker-smoke.mjs certflow:ci 2>&1 | tee reports/container-smoke.txt
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified image
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker tag certflow:ci "$IMAGE:$VERSION"
          docker tag certflow:ci "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
      - name: Record image digest and acceptance evidence
        env:
          REGISTRY_IMAGE: ${{ steps.version.outputs.image }}
          REQUIRE_PUBLISHED_DIGEST: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')) && '1' || '0' }}
        run: node scripts/image-evidence.mjs certflow:ci
      - name: Preserve container and image evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-image-evidence
          path: reports/
          if-no-files-found: warn
          retention-days: 30
